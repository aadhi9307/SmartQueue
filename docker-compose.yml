services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: smartqueue
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://smartqueue:${POSTGRES_PASSWORD}@db:5432/smartqueue
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
